# EdgeGuard demo configuration
# Paths are resolved relative to this file.

[gateway]
http_host=127.0.0.1
http_port=8080
web_root=../web
wal_path=../data/edgeguard.wal
rules=../rules/line1.rules
retention_seconds=3600
max_points_per_metric=200000
per_device_queue_capacity=8192
batch_size=256
wal_queue_capacity=65536
wal_flush_interval_ms=200

[logging]
level=info
file=../logs/edgeguard.log

[acquisition]
default_poll_interval_ms=250

[simulator]
port=15020

[device.boiler_01]
display_name=1号锅炉
host=127.0.0.1
port=15020
unit_id=1
interval_ms=250
metrics=temp:holding:0:u16:0.1:0:℃;pressure:holding:1:u16:0.01:0:MPa;vibration:holding:2:u16:0.01:0:mm/s;setpoint:holding:3:u16:0.1:0:℃;pump_on:coil:0:bool:1:0:

[device.pump_02]
display_name=2号循环泵
host=127.0.0.1
port=15020
unit_id=2
interval_ms=500
metrics=flow:holding:0:u16:0.1:0:m³/h;pressure:holding:1:u16:0.01:0:MPa;rpm:holding:2:u16:1:0:rpm;running:coil:0:bool:1:0:
